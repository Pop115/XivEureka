name: Build

# Every push / PR: build and test. A tag like v0.1.0: also publish a GitHub release with
# latest.zip and repo.json. Players add this custom repository in Dalamud:
#   https://github.com/Pop115/XivEureka/releases/latest/download/repo.json

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}\dalamud
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath $env:DALAMUD_HOME -Force

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        shell: pwsh
        run: dotnet test XivEureka.slnx -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Build plugin
        shell: pwsh
        run: dotnet build XivEureka/XivEureka.csproj -c Release -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: XivEureka
          path: XivEureka/bin/Release/XivEureka/latest.zip

      - name: Write repo.json
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $m = Get-Content XivEureka/bin/Release/XivEureka/XivEureka.json -Raw | ConvertFrom-Json
          $zip = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/latest.zip"
          $m | Add-Member RepoUrl "https://github.com/$env:GITHUB_REPOSITORY" -Force
          $m | Add-Member DownloadLinkInstall $zip
          $m | Add-Member DownloadLinkUpdate $zip
          $m | Add-Member DownloadLinkTesting $zip
          $m | Add-Member IsHide $false
          $m | Add-Member IsTestingExclusive $false
          $m | Add-Member LastUpdate ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
          ConvertTo-Json @($m) -Depth 5 | Set-Content repo.json -Encoding utf8NoBOM
          Get-Content repo.json

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME XivEureka/bin/Release/XivEureka/latest.zip repo.json --title $env:GITHUB_REF_NAME --generate-notes
